name: Build & Test Services

on:
  workflow_call:
    inputs:
      changed-services:
        required: true
        type: string  # JSON array string like ["gateway-service","QRtoPay"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.changed-services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        working-directory: app/${{ matrix.service }}
        run: mvn -B clean package -DskipTests

      - name: Test ${{ matrix.service }}
        working-directory: app/${{ matrix.service }}
        run: mvn test

      - name: Docker build & push (only on PR dev → main)
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        working-directory: app/${{ matrix.service }}
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${GITHUB_SHA}
          docker build -t $IMAGE .
          echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          docker push $IMAGE
