name: Detect Changed Services

on:
  workflow_call:
    outputs:
      services:
        description: "List of changed or new services under /app"
        value: ${{ jobs.detect.outputs.services }}
      full_build:
        description: "Whether a full build is required"
        value: ${{ jobs.detect.outputs.full_build }}

jobs:
  detect:
    name: Detect changed or new services dynamically
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      full_build: ${{ steps.detect.outputs.full_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base and head for diff
        id: branch-ref
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Compare head with base for PRs
            echo "BASE=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
            echo "HEAD=origin/${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            # For pushes, get all commits since the common ancestor with the base branch
            echo "BASE=origin/${{ github.base_ref }}" >> $GITHUB_OUTPUT
            echo "HEAD=HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed services
        id: detect
        run: |
          echo "Detecting changed modules..."
          changed_files=$(git diff --name-only ${{ steps.branch-ref.outputs.BASE }}...${{ steps.branch-ref.outputs.HEAD }} || true)

          # Check for changes in core files that require a full build
          if echo "$changed_files" | grep -E 'pom.xml|.proto'; then
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "full_build=true" >> $GITHUB_OUTPUT
            echo "Detected change in core file (pom.xml or .proto). Triggering full build."
            exit 0
          fi

          services=$(echo "$changed_files" | awk -F/ '{if (NF>2 && $1=="app") print "app/"$2}' | sort -u || true)

          if [ -z "$services" ]; then
            echo "No changed services detected."
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "full_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Detected changed services:"
          echo "$services"
          
          # Convert to single-line JSON
          json=$(printf '%s\n' "$services" | jq -R . | jq -s -c .)
          echo "services=$json" >> $GITHUB_OUTPUT
          echo "full_build=false" >> $GITHUB_OUTPUT
