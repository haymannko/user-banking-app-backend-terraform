name: Detect Changed or New Services

on:
  workflow_call:
    outputs:
      changed-services:
        value: ${{ jobs.detect.outputs.changed-services }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.output.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure SAFE before SHA
        id: refs
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD) # first commit
          fi
          echo "before-sha=$BEFORE_SHA" >> $GITHUB_OUTPUT

      - name: Detect changed services
        id: detect_changed
        run: |
          BEFORE_SHA="${{ steps.refs.outputs.before-sha }}"
          CURRENT_SHA="${{ github.sha }}"

          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" \
            | grep '^app/' \
            | grep -v '^app/infra/' \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | sort -u || true)

          echo "Changed services: $CHANGED"
          {
            echo "CHANGED<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Detect newly added services
        id: detect_new
        run: |
          BEFORE_SHA="${{ steps.refs.outputs.before-sha }}"
          CURRENT_SHA="${{ github.sha }}"

          NEW=$(git diff --name-status "$BEFORE_SHA" "$CURRENT_SHA" \
            | awk '/^A\s+app\// {print $2}' \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | sort -u || true)

          echo "New services: $NEW"
          {
            echo "NEW<<EOF"
            echo "$NEW"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create final services JSON output
        id: output
        run: |
          CHANGED="$CHANGED"
          NEW="$NEW"

          LIST=$(echo -e "$CHANGED\n$NEW" \
            | grep -E '^[a-zA-Z0-9_-]+$' \
            | grep -v '^infra$' \
            | sort -u || true)

          echo "FINAL SERVICE LIST: $LIST"

          if [ -z "$LIST" ]; then
            echo "✅ No service changes detected → skipping builds"
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          JSON=$(printf '%s\n' $LIST | jq -R . | jq -s -c .)
          echo "services=$JSON" >> $GITHUB_OUTPUT
          echo "✅ Services JSON generated: $JSON"
