name: Build and Test Service(s)

on:
  workflow_call:
    inputs:
      services:
        required: true
        type: string

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build & test service
        working-directory: ./app/${{ matrix.service }}
        run: |
          mvn clean test
