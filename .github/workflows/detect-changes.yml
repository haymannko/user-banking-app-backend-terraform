name: Detect Changed Services

on:
  workflow_call:
    outputs:
      changed-services:
        description: "List of services changed or newly added"
        value: ${{ jobs.detect.outputs.changed-services }}

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect changed + new services
        id: collect
        run: |
          # Detect changed services under app/
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^app/' || true \
            | cut -d/ -f2 \
            | sort -u)

          # All services under app/
          ALL=$(find app -maxdepth 1 -type d -not -path 'app' | cut -d/ -f2 | sort -u)

          # Merge and unique
          MERGED=$(printf '%s\n%s\n' "$CHANGED" "$ALL" | sort -u | grep -v '^$' || true)

          if [ -z "$MERGED" ]; then
            echo "⚠️ No services found — failing"
            exit 1
          fi

          printf '%s\n' "$MERGED" > merged.txt

      - name: Convert to JSON
        id: set
        run: |
          JSON=$(jq -R . < merged.txt | jq -s .)
          echo "✅ SERVICES: $JSON"
          echo "services=$JSON" >> $GITHUB_OUTPUT

