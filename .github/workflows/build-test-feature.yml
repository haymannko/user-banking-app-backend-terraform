name: Smart CI for Dynamic Maven Modules

on:
  push:
    branches:
      - dev
      - 'ft/*'
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 🔍 Detect changed or new services
        id: detect
        run: |
          echo "Detecting changed or new services..."
          git fetch origin --quiet

          BASE_BRANCH="origin/dev"
          CURRENT_BRANCH=${GITHUB_REF##*/}

          # Detect all existing Maven modules under app/
          EXISTING_MODULES=$(find app -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/pom.xml" ';' -print | xargs -n1 basename)
          echo "✅ Existing modules: $EXISTING_MODULES"

          if [[ "$CURRENT_BRANCH" == ft/* || "$CURRENT_BRANCH" == "dev" ]]; then
            if ! git rev-parse --verify $BASE_BRANCH >/dev/null 2>&1; then
              BASE_BRANCH=$(git rev-list --max-parents=0 HEAD)
            fi

            CHANGED_PATHS=$(git diff --name-only $BASE_BRANCH...HEAD | grep '^app/' || true)
            CHANGED_SERVICES=$(echo "$CHANGED_PATHS" | grep -Eo '^app/[^/]+' | cut -d'/' -f2 | sort -u || true)

            BASE_SERVICES=$(git ls-tree -d --name-only $BASE_BRANCH app 2>/dev/null || true)
            NEW_SERVICES=$(comm -13 <(echo "$BASE_SERVICES" | sort) <(echo "$EXISTING_MODULES" | sort) || true)

            MODULES=$(echo -e "$CHANGED_SERVICES\n$NEW_SERVICES" | sort -u | grep -Fx -f <(echo "$EXISTING_MODULES") || true)

            if [ -z "$MODULES" ]; then
              echo "⚠️ No changed or new modules detected."
              echo "modules=" >> $GITHUB_OUTPUT
            else
              echo "✅ Changed or new modules:"
              echo "$MODULES"
              {
                echo "modules<<EOF"
                echo "$MODULES"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            fi
          else
            echo "🧩 Pull request detected → build all modules."
            {
              echo "modules<<EOF"
              echo "$EXISTING_MODULES"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Build and Test Changed/New Modules
        if: steps.detect.outputs.modules != ''
        run: |
          echo "Building modules:"
          echo "${{ steps.detect.outputs.modules }}"

          cd app

          # Safely read multi-line output into an array
          echo "${{ steps.detect.outputs.modules }}" | while IFS= read -r module; do
            module=$(echo "$module" | xargs) # trim spaces
            if [ -n "$module" ] && [ -f "$module/pom.xml" ]; then
              echo "🔧 Building $module..."
              mvn -f "$module/pom.xml" clean verify -B
            else
              echo "⚠️ Skipping $module (no pom.xml found or empty name)"
            fi
          done

      - name: 🧱 Full Build (no detected modules)
        if: steps.detect.outputs.modules == ''
        run: |
          echo "Running full build..."
          mvn -f app/pom.xml clean verify -B
