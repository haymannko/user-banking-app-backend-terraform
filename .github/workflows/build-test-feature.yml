name: Dynamic Multi-Service CI

on:
  push:
    branches:
      - dev
      - 'ft/*'
  pull_request:
    branches:
      - dev
      - main

jobs:
  detect-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to detect file diffs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Detect new or changed services
        id: detect
        run: |
          echo "Detecting new or changed services..."

          git fetch origin --quiet

          # Find all service directories dynamically (with pom.xml)
          ALL_SERVICES=$(find . -mindepth 2 -maxdepth 2 -type f -name "pom.xml" | grep -oE "[^/]+/pom.xml" | cut -d'/' -f1 | sort -u)

          echo "All detected services:"
          echo "$ALL_SERVICES"

          # Determine if we're on feature or dev branch
          CURRENT_BRANCH=${GITHUB_REF##*/}

          # For ft/* and dev → only detect changed/new services
          if [[ "$CURRENT_BRANCH" == ft/* || "$CURRENT_BRANCH" == "dev" ]]; then
            BASE_BRANCH="origin/dev"
            if ! git rev-parse --verify $BASE_BRANCH >/dev/null 2>&1; then
              BASE_BRANCH=$(git rev-list --max-parents=0 HEAD)
            fi

            # Detect changes under /app/
            CHANGED_PATHS=$(git diff --name-only $BASE_BRANCH...HEAD | grep '^app/' || true)
            CHANGED_SERVICES=$(echo "$CHANGED_PATHS" | grep -Eo 'app/[^/]+/' | sort -u | cut -d'/' -f2 || true)

            # Detect newly added services (not in base branch)
            NEW_SERVICES=$(comm -13 <(git ls-tree -d --name-only $BASE_BRANCH app | sort) <(ls app | sort) || true)

            # Combine both changed and new
            MODULES=$(echo -e "$CHANGED_SERVICES\n$NEW_SERVICES" | sort -u | tr '\n' ' ' | xargs || true)

            if [ -z "$MODULES" ]; then
              echo "No changed or new services detected — skipping."
              echo "modules=" >> $GITHUB_OUTPUT
            else
              echo "Changed or new services: $MODULES"
              echo "modules=$MODULES" >> $GITHUB_OUTPUT
            fi

          else
            # For PRs (ft/* → dev or dev → main): build everything
            echo "Pull request to dev/main — building all services."
            echo "modules=$(echo $ALL_SERVICES | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Build and Test Changed/New Services
        if: steps.detect.outputs.modules != ''
        run: |
          echo "Building and testing modules: ${{ steps.detect.outputs.modules }}"
          for module in ${{ steps.detect.outputs.modules }}; do
            echo "🔧 Building $module..."
            mvn -f $module/pom.xml clean verify -B
          done

      - name: Fallback - Build All (no modules detected)
        if: steps.detect.outputs.modules == ''
        run: |
          echo "No specific modules detected. Running full build..."
          mvn -f pom.xml clean verify -B
