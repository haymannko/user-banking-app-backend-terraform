name: Feature Branch Build & Test

on:
  push:
    branches:
      - "ft/*"
jobs:
  detect:
    uses: ./.github/workflows/detect-changes.yml

  build-test:
    name: Build & Test Changed Services
    needs: detect
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.services != '[]' }}
    strategy:
        matrix:
          service: ${{ fromJSON(needs.detect.outputs.services) }}
    steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 17
            cache: maven

        - name: Install shared parent pom
          run: |
            echo "Installing shared parent pom.xml..."
            mvn -f app/pom.xml clean install -DskipTests

        - name: Build and test changed service
          run: |
            cd ${{ matrix.service }}
            mvn clean verify -B

        - name: Upload Test Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.service }}-test-results
            path: ${{ matrix.service }}/target/surefire-reports/

