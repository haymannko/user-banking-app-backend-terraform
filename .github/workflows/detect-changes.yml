name: Detect Changed or New Services

on:
  workflow_call:
    outputs:
      changed-services:
        description: "List of changed or newly added services"
        value: ${{ jobs.detect.outputs.changed-services }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.set-output.outputs.services }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect-changed
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^app/' \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | sort -u)

          echo "Changed services: $CHANGED"

      - name: Detect newly added services
        id: detect-new
        run: |
          NEW=$(find app -maxdepth 1 -mindepth 1 -type d \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | while read d; do
                # Check if the directory was added in this push
                if git diff --name-status ${{ github.event.before }} ${{ github.sha }} | grep -q "^A\sapp/$d"; then
                  echo $d
                fi
              done)

          echo "New services: $NEW"

      - name: Combine changed + new services
        id: set-output
        run: |
          ALL_SERVICES=$(echo -e "$CHANGED\n$NEW" | grep -v '^$' | sort -u)
          if [ -z "$ALL_SERVICES" ]; then
            echo "No changed or new services detected."
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi
          SERVICES_JSON=$(printf '%s\n' $ALL_SERVICES | jq -R . | jq -s .)
          echo "Services to process: $SERVICES_JSON"
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
