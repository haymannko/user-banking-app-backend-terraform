name: Maven Build

on:
  workflow_call:
    inputs:
      services:
        description: "JSON array of services to build"
        required: true
        type: string
      full_build_required:
        description: "True if a full build of all modules is required"
        required: true
        type: boolean

jobs:
  build:
    name: Build & Test Services
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for caching and potentially other actions
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # If a full build is required, install all dependencies first
      - name: Compile and Install all dependencies (Full Build Pre-step)
        if: ${{ inputs.full_build_required }}
        run: mvn clean install -DskipTests

      # Build and test the services
      - name: Build and test service(s)
        run: |
          echo "Building and testing ${{ matrix.service }}"
          if [[ "${{ inputs.full_build_required }}" == "true" ]]; then
            cd ${{ matrix.service }}
            mvn verify -B
          else
            mvn verify -B -pl ${{ matrix.service }} -am
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: ${{ matrix.service }}/target/surefire-reports/

