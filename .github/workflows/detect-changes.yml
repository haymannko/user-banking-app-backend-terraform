name: Detect Changed Services

on:
  workflow_call:
    outputs:
      changed-services:
        description: "List of services changed or newly added (excluding infra)"
        value: ${{ jobs.detect.outputs.changed-services }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.set-output.outputs.services }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed

      - name: Determine changed services
        id: detect
        run: |
          # Detect changes under app/, exclude infra
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^app/' \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | sort -u)
          echo "CHANGED=$CHANGED"

      - name: Detect newly added services (directories)
        id: detect-new
        run: |
          ALL_SERVICES=$(find app -maxdepth 1 -mindepth 1 -type d | cut -d/ -f2 | grep -v '^infra$' | sort -u)
          echo "ALL_SERVICES=$ALL_SERVICES"

      - name: Merge changed and new services
        id: merge
        run: |
          # Split CHANGED by comma
          CHANGED_LINES=$(echo "$CHANGED" | tr ',' '\n' | grep -v '^$')

          # Merge with ALL_SERVICES
          MERGED=$(echo -e "$CHANGED_LINES\n$ALL_SERVICES" | grep -v '^$' | sort -u)

          # Fallback if empty
          if [ -z "$MERGED" ]; then
            echo "⚠️ No changes detected — defaulting to all services"
            MERGED=$ALL_SERVICES
          fi

          # Convert to JSON array
          MERGED_JSON=$(echo "$MERGED" | jq -R . | jq -s .)

          echo "services=$MERGED_JSON" >> $GITHUB_OUTPUT
          echo "Merged services JSON: $MERGED_JSON"

      - name: Set output
        id: set-output
        run: |
          # Re-use MERGED_JSON from previous step
          echo "services=$MERGED_JSON" >> $GITHUB_OUTPUT
