name: CI/CD Pipeline

on:
  push:
    branches:
      - 'ft/**' # Matches ft/some-feature, ft/another-feature, etc.
      - 'dev'
  pull_request:
    branches:
      - 'dev'
      - 'main'

jobs:
  # Job to detect changes. Only run on pushes to feature branches.
  detect-changes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ft/')
    uses: ./.github/workflows/detect-changes.yml

  # Job to prepare the build matrix based on the event and detected changes.
  generate-build-matrix:
    runs-on: ubuntu-latest
    needs: detect-changes
    outputs:
      services: ${{ steps.prepare-matrix.outputs.services }}
      full_build: ${{ steps.prepare-matrix.outputs.full_build }}
    steps:
      - name: Prepare matrix for build
        id: prepare-matrix
        run: |
          # The list of ALL services. IMPORTANT: Keep this list up to date.
          FULL_SERVICES='["app/gateway-service", "app/personal-transaction-module", "app/nickname", "app/other-service"]'

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "::notice::Pull request detected. Generating matrix for ALL services."
            echo "services=$FULL_SERVICES" >> $GITHUB_OUTPUT
            echo "full_build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.detect-changes.outputs.full_build }}" == "true" ]]; then
            echo "::notice::Core change detected. Generating matrix for ALL services."
            echo "services=$FULL_SERVICES" >> $GITHUB_OUTPUT
            echo "full_build=true" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.detect-changes.outputs.services }}" != "[]" ]]; then
            echo "::notice::Feature branch push detected. Generating matrix for changed services."
            echo "services=${{ needs.detect-changes.outputs.services }}" >> $GITHUB_OUTPUT
            echo "full_build=false" >> $GITHUB_OUTPUT
          else
            echo "::notice::No services detected to build. Skipping."
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "full_build=false" >> $GITHUB_OUTPUT
          fi

  # Job to call the reusable Maven build workflow.
  call-maven-build:
    needs: generate-build-matrix
    if: fromJson(needs.generate-build-matrix.outputs.services) != '[]'
    uses: ./.github/workflows/maven-build.yml
    with:
      services: ${{ needs.generate-build-matrix.outputs.services }}
      full_build_required: ${{ needs.generate-build-matrix.outputs.full_build }}
