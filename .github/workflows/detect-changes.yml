name: Detect Changed Services

on:
  workflow_call:
    outputs:
      changed-services:
        description: "List of services changed or newly added (excluding infra)"
        value: ${{ jobs.detect.outputs.changed-services }}
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.set-output.outputs.services }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required

      - name: Determine changed services
        id: detect
        run: |
          # Detect changes under app/, exclude infra
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^app/' \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | sort -u)

          echo "CHANGED=$CHANGED" >> $GITHUB_ENV

      - name: Detect newly added services (directories)
        id: detect-new
        run: |
          # All directories under app/, exclude infra
           ALL_SERVICES=$(find app -maxdepth 1 -mindepth 1 -type d \
            | cut -d/ -f2 \
            | grep -v '^infra$' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')
  
            echo "ALL_SERVICES=$ALL_SERVICES" >> $GITHUB_ENV

      - name: Merge changed and new services
        id: merge
        run: |
          MERGED=$(echo -e "$CHANGED\n$ALL_SERVICES" | grep -v '^$' | sort -u)
          if [ -z "$MERGED" ]; then
            echo "⚠️ No changes detected — scanning all services!"
            MERGED=$ALL_SERVICES
          fi

          # Convert to JSON array
          MERGED_JSON=$(printf '%s\n' $MERGED | jq -R . | jq -s .)
          echo "services=$MERGED_JSON" >> $GITHUB_OUTPUT
          echo "Merged services JSON: $MERGED_JSON"

      - name: Output result
        id: set-output
        run: |
          # Use merged JSON for output
          echo "services=$MERGED_JSON" >> $GITHUB_OUTPUT


 
