name: Docker Image Release

on:
  workflow_call:
    inputs:
      changed-services:
        required: true
        type: string
      tag:
        description: "Image version tag"
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push
        working-directory: app/${{ matrix.service }}
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ inputs.tag }}
          echo "Building $IMAGE"
          docker build -t $IMAGE .
          docker push $IMAGE

