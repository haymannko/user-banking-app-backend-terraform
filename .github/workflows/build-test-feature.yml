name: Dynamic Build & Test

on:
  push:
    branches:
      - "ft/*"
  pull_request:
    branches:
      - 'dev'
      - 'main'

jobs:
  # Detect changes only on ft/* branch pushes
  detect:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ft/')
    uses: ./.github/workflows/detect-changes.yml

  build-test:
    name: Build & Test Services
    runs-on: ubuntu-latest
    needs: detect

    # Trigger logic:
    # 1. On PR to dev/main (no detect job needed)
    # 2. On ft/* push where changes were detected or a full build is required
    if: |
      github.event_name == 'pull_request' ||
      (needs.detect.result == 'success' && (needs.detect.outputs.services != '[]' || needs.detect.outputs.full_build == 'true'))

    strategy:
      fail-fast: false
      matrix:
        service: >-
          ${{ 
            github.event_name == 'pull_request' && 
            '["app/gateway-service", "app/personal-transaction-module", "app/other-service"]' ||
            needs.detect.outputs.full_build == 'true' && 
            '["app/gateway-service", "app/personal-transaction-module", "app/other-service"]' ||
            fromJson(needs.detect.outputs.services)
          }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Step to pre-build all dependencies for full builds (PR or core changes)
      - name: Compile and Install all dependencies (Full Build Pre-step)
        if: github.event_name == 'pull_request' || needs.detect.outputs.full_build == 'true'
        run: mvn clean install -DskipTests

      # Step to build and test the services based on the event
      - name: Build and test service(s)
        run: |
          echo "Building and testing ${{ matrix.service }}"
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ needs.detect.outputs.full_build }}" == "true" ]]; then
            # For PRs or core changes, the full dependency tree is already in place.
            cd ${{ matrix.service }}
            mvn verify -B
          else
            # For feature branch changes, use -pl and -am to correctly handle dependencies.
            mvn verify -B -pl ${{ matrix.service }} -am
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-results
          path: ${{ matrix.service }}/target/surefire-reports/
