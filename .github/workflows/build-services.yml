name: Reusable Build and Test Pipeline

on:
  workflow_call:
    inputs:
      run_full_build:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff detection

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Detect changed or new services
        id: detect-services
        run: |
          echo "Detecting changed or new services..."

          BASE_REF=${{ github.event.before }}
          HEAD_REF=${{ github.sha }}

          # Handle initial commits (no before)
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git rev-list --max-parents=0 HEAD)
          fi

          # 1️⃣ Find all current modules under app/
          EXISTING_MODULES=$(find app -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/pom.xml" ';' -print | xargs -n1 basename)
          echo "Existing modules (app/* with pom.xml):"
          echo "$EXISTING_MODULES"

          # 2️⃣ If full build is requested (for PRs)
          if [ "${{ inputs.run_full_build }}" = "true" ]; then
            echo "Full build requested — building all modules."
            echo "modules=$(echo "$EXISTING_MODULES" | tr '\n' ' ')" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3️⃣ Get changed paths
          CHANGED_PATHS=$(git diff --name-only "$BASE_REF" "$HEAD_REF" | grep '^app/' || true)
          echo "Raw changed paths (relative to repo root):"
          echo "$CHANGED_PATHS"

          # 4️⃣ Filter modules that actually changed
          CHANGED_MODULES=""
          for path in $CHANGED_PATHS; do
            service=$(echo "$path" | cut -d'/' -f2)
            if [ -f "app/$service/pom.xml" ]; then
              CHANGED_MODULES="$CHANGED_MODULES $service"
            fi
          done

          CHANGED_OR_NEW=$(echo "$CHANGED_MODULES" | tr ' ' '\n' | sort -u)
          echo "✅ Changed or new modules to build:"
          echo "$CHANGED_OR_NEW"

          if [ -z "$CHANGED_OR_NEW" ]; then
            echo "No changed or new services detected — skipping."
            echo "modules=" >> $GITHUB_OUTPUT
          else
            echo "modules=$(echo "$CHANGED_OR_NEW" | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Build & Test Changed Services
        if: steps.detect-services.outputs.modules != ''
        run: |
          echo "Building modules:"
          for module in ${{ steps.detect-services.outputs.modules }}; do
            echo "🔧 Building $module..."
            mvn -B -f "app/$module/pom.xml" clean test
          done

      - name: No Changed Modules
        if: steps.detect-services.outputs.modules == ''
        run: echo "✅ No services to build or test."
