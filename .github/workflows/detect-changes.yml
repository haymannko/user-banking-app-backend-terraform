name: Detect Changed Services
on:
  workflow_call:
    outputs:
      services:
        description: "List of changed or new services under /app"
        value: ${{ jobs.detect.outputs.services }}

jobs:
  detect:
    name: Detect changed or new services dynamically
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed or new services
        id: detect
        run: |
                changed=$(git diff --name-only HEAD~1 HEAD | grep '^app/' | cut -d'/' -f2 | sort -u | sed 's|^|app/|' || true)
                if [ -z "$changed" ]; then
                  echo "No changed services detected."
                  echo "services=[]" >> $GITHUB_OUTPUT
                else
                  echo "Detected changed services:"
                  echo "$changed"
                  json=$(printf '%s\n' "$changed" | jq -R . | jq -s .)
                  echo "services=$json" >> $GITHUB_OUTPUT
                fi