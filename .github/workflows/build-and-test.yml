

name: Build & Test Services

on:
  workflow_call:
    inputs:
      changed-services:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.changed-services) }}

    env:
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}   # correct secret
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build & Test
        working-directory: app/${{ matrix.service }}
        run: mvn -B clean install

      - name: Build Docker image
        id: build_image
        working-directory: app/${{ matrix.service }}
        run: |
          IMAGE_TAG=${{ github.sha }}
          REPO="userbanking/${{ matrix.service }}"
          IMAGE_NAME="$ECR_REGISTRY/$REPO:$IMAGE_TAG"
          docker build -t $IMAGE_NAME .
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Push Docker image
        run: |
          docker push ${{ steps.build_image.outputs.image_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: app/${{ matrix.service }}/
