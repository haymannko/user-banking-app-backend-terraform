
name: Detect Changed Services

on:
  workflow_call:

jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      changed-services: ${{ steps.set-output.outputs.changed-services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed microservices
        id: detect
        run: |
          SERVICES=("gateway-service" "nickname-service" "personal-user-service" \
                    "personal-transaction-service" "QRtoPay")

          CHANGED=()

          for SERVICE in "${SERVICES[@]}"; do
            if git diff --name-only HEAD^ HEAD | grep -q "app/$SERVICE/"; then
              CHANGED+=("\"$SERVICE\"")
            fi
          done

          # If no changes, put empty list
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "changed-services=[]" >> $GITHUB_OUTPUT
          else
            LIST=$(printf ",%s" "${CHANGED[@]}")
            LIST="[${LIST:1}]"
            echo "changed-services=$LIST" >> $GITHUB_OUTPUT
          fi

      - name: Set output
        id: set-output
        run: |
          echo "changed-services=${{ steps.detect.outputs.changed-services }}" >> $GITHUB_OUTPUT

  