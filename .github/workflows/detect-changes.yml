name: Detect Changed Services

on:
  workflow_call:
    outputs:
      changed-services:
        description: "List of services changed or newly added"
        value: ${{ jobs.detect.outputs.changed-services }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.set-output.outputs.services }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^app/' | cut -d/ -f2 | grep -v '^infra$' | sort -u)
          echo "CHANGED=$CHANGED"

      - name: Detect newly added services
        id: detect-new
        run: |
          ALL_SERVICES=$(find app -maxdepth 1 -type d -not -path 'app' -not -name 'infra' | cut -d/ -f2)
          echo "ALL_SERVICES=$ALL_SERVICES"

      - name: Merge changed + new services
        id: merge
        run: |
          MERGED=$(echo -e "$CHANGED\n$ALL_SERVICES" | sort -u)
          if [ -z "$MERGED" ]; then
            echo "⚠️ No changes detected, defaulting to ALL_SERVICES"
            MERGED=$ALL_SERVICES
          fi
          # convert to JSON array
          MERGED_JSON=$(printf '%s\n' $MERGED | jq -R . | jq -s .)
          echo "SERVICES=$MERGED_JSON" >> $GITHUB_OUTPUT
          echo "Merged services JSON: $MERGED_JSON"

      - name: Set output
        id: set-output
        run: |
          echo "services=$MERGED_JSON" >> $GITHUB_OUTPUT
