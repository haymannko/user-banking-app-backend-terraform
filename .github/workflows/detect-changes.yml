name: Detect Changed Services
on:
  workflow_call:
    outputs:
      services:
        description: "List of changed or new services under /app"
        value: ${{ jobs.detect.outputs.services }}

jobs:
  detect:
    name: Detect changed or new services dynamically
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed services
        id: detect
        run: |
          echo "Detecting changed modules..."
          # Find all changed files under app/
          changed=$(git diff --name-only HEAD~1 HEAD | grep '^app/' || true)

          # Extract unique service directories (2nd-level only)
          services=$(echo "$changed" | awk -F/ '{if (NF>2) print "app/"$2}' | sort -u || true)

          # If nothing changed
          if [ -z "$services" ]; then
            echo "No changed services detected."
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Detected changed services:"
          echo "$services"

          # Convert list to valid JSON array
          json=$(printf '%s\n' "$services" | jq -R . | jq -s .)
          echo "services=$json" >> $GITHUB_OUTPUT
