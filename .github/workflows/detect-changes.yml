name: Detect Changed Services

on:
  workflow_call:
    outputs:
      services:
        description: "List of changed or new services under /app"
        value: ${{ jobs.detect.outputs.services }}
      full_build:
        description: "Whether a full build is required"
        value: ${{ jobs.detect.outputs.full_build }}

jobs:
  detect:
    name: Detect changed or new services dynamically
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      full_build: ${{ steps.detect.outputs.full_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base and head for diff
        id: branch-ref
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Use fetch_head for PRs as it references the merge base
            echo "BASE=HEAD^1" >> $GITHUB_OUTPUT
            echo "HEAD=HEAD" >> $GITHUB_OUTPUT
          else
            # For pushes, get all commits since the last push to the default branch
            echo "BASE=origin/${{ github.event.repository.default_branch }}" >> $GITHUB_OUTPUT
            echo "HEAD=HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed services
        id: detect
        run: |
          echo "Determining changed modules based on diff between ${{ steps.branch-ref.outputs.BASE }} and ${{ steps.branch-ref.outputs.HEAD }}"
          
          # Detect changes to core files that affect the entire build
          core_files_changed=$(git diff --name-only ${{ steps.branch-ref.outputs.BASE }}...${{ steps.branch-ref.outputs.HEAD }} | grep -E 'pom.xml|.proto')
          if [[ ! -z "$core_files_changed" ]]; then
            echo "::notice::Core files (pom.xml or .proto) were changed. Triggering a full build."
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "full_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Detect changed service modules under /app
          changed_services=$(git diff --name-only ${{ steps.branch-ref.outputs.BASE }}...${{ steps.branch-ref.outputs.HEAD }} | awk -F'/' '{if ($1=="app" && $2!="") print "app/"$2}' | sort -u || true)

          if [ -z "$changed_services" ]; then
            echo "::notice::No changed services detected. Skipping."
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "full_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::notice::Detected changed services:"
          echo "$changed_services"
          
          # Convert to single-line JSON array for output
          json_output=$(printf '%s\n' "$changed_services" | jq -R . | jq -s -c .)
          echo "services=$json_output" >> $GITHUB_OUTPUT
          echo "full_build=false" >> $GITHUB_OUTPUT

