name: Detect Changed or New Services

on:
  workflow_call:
    # output for inputs: values inputs build and test jobs
    outputs:
      changed-services:
        value: ${{ jobs.detect.outputs.changed-services }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed-services: ${{ steps.output.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine before commit
        id: refs
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "before-sha=$BEFORE_SHA" >> $GITHUB_OUTPUT

      - name: Detect changed services
        id: detect_changed
        run: |
          BEFORE="${{ steps.refs.outputs.before-sha }}"
          NOW="${{ github.sha }}"

          CHANGED=$(git diff --name-only "$BEFORE" "$NOW" \
            | grep '^app/' \
            | grep -v '^app/infra/' \
            | cut -d/ -f2 \
            | sort -u || true)

          echo "CHANGED<<EOF" >> $GITHUB_ENV
          echo "$CHANGED" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Detect newly added services
        id: detect_new
        run: |
          BEFORE="${{ steps.refs.outputs.before-sha }}"
          NOW="${{ github.sha }}"

          NEW=$(git diff --name-status "$BEFORE" "$NOW" \
            | awk '/^A\s+app\// {print $2}' \
            | cut -d/ -f2 \
            | sort -u || true)

          echo "NEW<<EOF" >> $GITHUB_ENV
          echo "$NEW" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create services JSON output
        id: output
        run: |
          LIST=$(echo -e "$CHANGED\n$NEW" | grep -E '^[a-zA-Z0-9_-]+$' | sort -u)
          echo "FINAL LIST: $LIST"

          if [ -z "$LIST" ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          JSON=$(printf '%s\n' $LIST | jq -R . | jq -s -c .)
          echo "services=$JSON" >> $GITHUB_OUTPUT
